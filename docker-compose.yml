services:

  app:
    build: .
    env_file:
      - .env.example
    environment:
      APP_HOST: 0.0.0.0
      DB_HOST: db
    command: ["sh", "-c", "uvicorn exchange.main:app --host $$APP_HOST --port $$APP_PORT"]
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    env_file:
      - .env.example
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT:-5432}:5432"

volumes:
  postgres_data:
